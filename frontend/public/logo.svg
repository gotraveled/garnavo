<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162038"/>
      <stop offset="1" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="shOuter" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFB48C"/>
      <stop offset="0.35" stop-color="#FF6030"/>
      <stop offset="0.7" stop-color="#D04010"/>
      <stop offset="1" stop-color="#B03010"/>
    </linearGradient>
    <linearGradient id="shInner" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1C2C48"/>
      <stop offset="1" stop-color="#0C1420"/>
    </linearGradient>
    <linearGradient id="gMetal" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#E0E0E0"/>
      <stop offset="1" stop-color="#B0B0B0"/>
    </linearGradient>
    <linearGradient id="xbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC08C"/>
      <stop offset="1" stop-color="#FF6C40"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.42" cy="0.22" r="0.4">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Outer shield -->
  <path d="M 256 78 L 406 140 Q 410 142 410 160 L 410 274 Q 410 348 256 440 Q 102 348 102 274 L 102 160 Q 102 142 106 140 Z" fill="url(#shOuter)"/>
  <!-- Glossy highlight -->
  <path d="M 256 78 L 406 140 Q 410 142 410 160 L 410 274 Q 410 348 256 440 Q 102 348 102 274 L 102 160 Q 102 142 106 140 Z" fill="url(#gloss)"/>

  <!-- Inner shield -->
  <path d="M 256 122 L 376 170 Q 376 178 376 184 L 376 276 Q 376 332 256 404 Q 136 332 136 276 L 136 184 Q 136 178 136 170 Z" fill="url(#shInner)"/>

  <!-- G letterform -->
  <rect x="192" y="188" width="38" height="148" rx="19" fill="url(#gMetal)"/>
  <rect x="192" y="188" width="112" height="38" rx="19" fill="url(#gMetal)"/>
  <rect x="192" y="298" width="128" height="38" rx="19" fill="url(#gMetal)"/>
  <rect x="282" y="254" width="38" height="82" rx="19" fill="url(#gMetal)"/>
  <rect x="244" y="258" width="76" height="30" rx="15" fill="url(#xbar)"/>

  <!-- G top highlight -->
  <rect x="200" y="192" width="96" height="10" rx="5" fill="#FFFFFF" opacity="0.35"/>
  <!-- Specular on shield -->
  <ellipse cx="232" cy="105" rx="24" ry="7" fill="#FFFFFF" opacity="0.35"/>
