<!DOCTYPE html>
<html>
<head><title>Logo Comparison</title>
<style>
  body { font-family: system-ui; background: #f5f5f5; display: flex; flex-direction: column; align-items: center; padding: 40px; gap: 40px; }
  .row { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .card { background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; width: 280px; }
  .card h3 { margin: 0 0 4px; color: #333; font-size: 16px; }
  .card .tag { font-size: 11px; color: #888; margin-bottom: 16px; }
  .sizes { display: flex; gap: 20px; align-items: flex-end; margin-top: 16px; justify-content: center; }
  .size-label { font-size: 11px; color: #999; margin-top: 4px; }
  .navbar-demo { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 12px 20px; display: flex; align-items: center; gap: 10px; margin-top: 16px; justify-content: center; }
  .navbar-demo span { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
  .dark-bg { background: #101826; border-radius: 12px; padding: 20px; margin-top: 16px; display: inline-block; }
</style>
</head>
<body>
  <h1 style="font-size:24px;">Logo Comparison</h1>
  <div class="row">
    <div class="card">
      <h3>Current</h3>
      <div class="tag">Arc-style G</div>
      <img src="logo.svg" width="180" height="180">
      <div class="sizes">
        <div><img src="logo.svg" width="36" height="36" style="border-radius:8px"><div class="size-label">36px</div></div>
        <div><img src="logo.svg" width="64" height="64" style="border-radius:12px"><div class="size-label">64px</div></div>
      </div>
      <div class="navbar-demo">
        <img src="logo.svg" width="36" height="36" style="border-radius:8px">
        <span>Garnavo</span>
      </div>
    </div>

    <div class="card">
      <h3>Option A — Geometric Blocks</h3>
      <div class="tag">Bold, architectural, layered</div>
      <img src="logo-v2.svg" width="180" height="180">
      <div class="sizes">
        <div><img src="logo-v2.svg" width="36" height="36" style="border-radius:8px"><div class="size-label">36px</div></div>
        <div><img src="logo-v2.svg" width="64" height="64" style="border-radius:12px"><div class="size-label">64px</div></div>
      </div>
      <div class="navbar-demo">
        <img src="logo-v2.svg" width="36" height="36" style="border-radius:8px">
        <span>Garnavo</span>
      </div>
    </div>

    <div class="card">
      <h3>Option B — Shield + G</h3>
      <div class="tag">Security-focused, premium</div>
      <img src="logo-v3.svg" width="180" height="180">
      <div class="sizes">
        <div><img src="logo-v3.svg" width="36" height="36" style="border-radius:8px"><div class="size-label">36px</div></div>
        <div><img src="logo-v3.svg" width="64" height="64" style="border-radius:12px"><div class="size-label">64px</div></div>
      </div>
      <div class="navbar-demo">
        <img src="logo-v3.svg" width="36" height="36" style="border-radius:8px">
        <span>Garnavo</span>
      </div>
    </div>
  </div>
  <p style="color:#888; font-size:13px;">Refresh the page if you opened it before. Tell me which one you like or what to change.</p>
</body>
</html>
