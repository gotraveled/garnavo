<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141E30"/>
      <stop offset="1" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8C5A"/>
      <stop offset="1" stop-color="#FF5533"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB088"/>
      <stop offset="1" stop-color="#FF7A55"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Geometric G built from overlapping shapes -->

  <!-- Back layer: large angled block — left vertical of G -->
  <rect x="118" y="120" width="72" height="272" rx="36" fill="url(#accent2)" opacity="0.5"/>

  <!-- Middle layer: top horizontal bar -->
  <rect x="118" y="120" width="220" height="72" rx="36" fill="url(#accent1)"/>

  <!-- Middle layer: bottom horizontal bar -->
  <rect x="118" y="320" width="260" height="72" rx="36" fill="url(#accent1)"/>

  <!-- Front layer: right vertical (short, forms the inward arm of G) -->
  <rect x="306" y="248" width="72" height="144" rx="36" fill="url(#accent2)"/>

  <!-- Crossbar — the defining feature of G -->
  <rect x="226" y="248" width="152" height="56" rx="28" fill="#FFFFFF" opacity="0.95"/>

  <!-- Glass shine overlay on top-left corner -->
  <path d="M 226 120 Q 154 120 154 156 L 154 184 Q 154 120 226 120 Z" fill="url(#accent3)"/>

  <!-- Small dot accent — finishing touch -->
  <circle cx="342" cy="156" r="20" fill="url(#accent2)" opacity="0.35"/>
</svg>
