<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background -->
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2540"/>
      <stop offset="1" stop-color="#080D1A"/>
    </linearGradient>

    <!-- Shield outer — 3D metallic coral -->
    <linearGradient id="shieldOuter" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFAD8A"/>
      <stop offset="0.15" stop-color="#FF8050"/>
      <stop offset="0.45" stop-color="#FF5530"/>
      <stop offset="0.7" stop-color="#D93E18"/>
      <stop offset="1" stop-color="#B83010"/>
    </linearGradient>

    <!-- Shield left highlight — simulates light from top-left -->
    <linearGradient id="shieldHL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Inner dark inset — deep, rich -->
    <linearGradient id="innerShield" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1E2E4A"/>
      <stop offset="1" stop-color="#0C1424"/>
    </linearGradient>

    <!-- G letter metallic gradient -->
    <linearGradient id="gMetal" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.3" stop-color="#F0F0F0"/>
      <stop offset="0.55" stop-color="#D8D8D8"/>
      <stop offset="0.8" stop-color="#BBBBBB"/>
      <stop offset="1" stop-color="#A0A0A0"/>
    </linearGradient>

    <!-- Crossbar warm accent -->
    <linearGradient id="crossbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB088"/>
      <stop offset="1" stop-color="#FF6B40"/>
    </linearGradient>

    <!-- Glossy top reflection -->
    <linearGradient id="gloss" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient glow -->
    <radialGradient id="ambientGlow" cx="0.5" cy="0.42" r="0.35">
      <stop offset="0" stop-color="#FF6B45" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FF6B45" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow for shield -->
    <filter id="shieldShadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#FF4422" flood-opacity="0.35"/>
    </filter>

    <!-- Inner shadow for depth -->
    <filter id="innerGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF6B45" flood-opacity="0.25"/>
    </filter>

    <!-- Bevel highlight for G -->
    <filter id="gBevel" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Edge rim light on shield -->
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" rx="108" fill="url(#bg3)"/>

  <!-- Ambient glow behind shield -->
  <circle cx="256" cy="250" r="180" fill="url(#ambientGlow)"/>

  <!-- === SHIELD BODY === -->
  <!-- Shield base with drop shadow -->
  <path
    d="M 256 78 L 392 138 C 400 142 406 152 406 162 L 406 270 C 406 340 346 404 256 434 C 166 404 106 340 106 270 L 106 162 C 106 152 112 142 120 138 Z"
    fill="url(#shieldOuter)"
    filter="url(#shieldShadow)"
  />

  <!-- Shield rim / edge highlight -->
  <path
    d="M 256 78 L 392 138 C 400 142 406 152 406 162 L 406 270 C 406 340 346 404 256 434 C 166 404 106 340 106 270 L 106 162 C 106 152 112 142 120 138 Z"
    fill="none"
    stroke="url(#rimLight)"
    stroke-width="2.5"
  />

  <!-- 3D glossy top reflection on shield -->
  <path
    d="M 256 78 L 392 138 C 400 142 406 152 406 162 L 406 210 Q 330 195 256 192 Q 182 195 106 210 L 106 162 C 106 152 112 142 120 138 Z"
    fill="url(#gloss)"
  />

  <!-- Shield highlight left edge (top-left light source) -->
  <path
    d="M 256 78 L 120 138 C 112 142 106 152 106 162 L 106 270 C 106 300 118 330 140 355 L 140 162 C 140 155 143 150 148 148 L 256 100 Z"
    fill="url(#shieldHL)"
  />

  <!-- === INNER SHIELD CUTOUT === -->
  <path
    d="M 256 122 L 362 168 C 368 171 372 178 372 184 L 372 272 C 372 324 326 372 256 398 C 186 372 140 324 140 272 L 140 184 C 140 178 144 171 150 168 Z"
    fill="url(#innerShield)"
    filter="url(#innerGlow)"
  />

  <!-- Subtle inner shield top reflection -->
  <path
    d="M 256 122 L 362 168 C 368 171 372 178 372 184 L 372 218 Q 314 208 256 206 Q 198 208 140 218 L 140 184 C 140 178 144 171 150 168 Z"
    fill="#FFFFFF" opacity="0.05"
  />

  <!-- === G LETTERFORM — metallic 3D === -->
  <g filter="url(#gBevel)">
    <!-- Left vertical -->
    <rect x="192" y="188" width="38" height="148" rx="19" fill="url(#gMetal)"/>
    <!-- Top horizontal arm -->
    <rect x="192" y="188" width="112" height="38" rx="19" fill="url(#gMetal)"/>
    <!-- Bottom horizontal arm -->
    <rect x="192" y="298" width="128" height="38" rx="19" fill="url(#gMetal)"/>
    <!-- Right short vertical -->
    <rect x="282" y="254" width="38" height="82" rx="19" fill="url(#gMetal)"/>
  </g>

  <!-- Crossbar — warm accent coral -->
  <rect x="244" y="256" width="76" height="32" rx="16" fill="url(#crossbar)"/>

  <!-- Glossy shine streak on G top arm -->
  <rect x="200" y="192" width="96" height="12" rx="6" fill="#FFFFFF" opacity="0.35"/>

  <!-- Tiny specular highlight dot on shield top -->
  <ellipse cx="230" cy="110" rx="18" ry="6" fill="#FFFFFF" opacity="0.25"/>
</svg>
